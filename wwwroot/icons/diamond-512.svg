<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <rect width="512" height="512" rx="80" fill="#1a1a2e"/>
  <g transform="translate(256,260)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <!-- Diamond shape -->
    <polygon points="0,-145 130,-50 80,105 -80,105 -130,-50" fill="#58a6ff" opacity="0.2" stroke="#58a6ff" stroke-width="5"/>
    <line x1="0" y1="-145" x2="80" y2="105" stroke="#58a6ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="0" y1="-145" x2="-80" y2="105" stroke="#58a6ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="-130" y1="-50" x2="130" y2="-50" stroke="#58a6ff" stroke-width="2.5" opacity="0.5"/>
    <line x1="0" y1="-145" x2="0" y2="105" stroke="#58a6ff" stroke-width="2.5" opacity="0.3"/>
    <!-- Camera icon -->
    <g transform="translate(65,-120) scale(1.5)">
      <rect x="-12" y="-8" width="24" height="18" rx="3" fill="#e6edf3" opacity="0.9"/>
      <circle cx="0" cy="2" r="5" fill="none" stroke="#1a1a2e" stroke-width="2"/>
      <rect x="-4" y="-11" width="8" height="4" rx="1" fill="#e6edf3" opacity="0.9"/>
    </g>
  </g>
  <text x="256" y="450" text-anchor="middle" fill="#8b949e" font-family="sans-serif" font-size="38" font-weight="600">DIAMONDS FOTO</text>
</svg>
