    <line x1="-50" y1="-20" x2="50" y2="-20" stroke="#58a6ff" stroke-width="1.5" opacity="0.5"/>
    <line x1="0" y1="-55" x2="0" y2="40" stroke="#58a6ff" stroke-width="1.5" opacity="0.3"/>
